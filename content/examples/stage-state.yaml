# A generated StageState, mid-stage.
#
# This is what the generation pipeline (docs/04 §3) emits and what the engine
# (docs/02) consumes. Note:
#   - Player pieces carry instanceId (they belong to the deck, so they can die).
#   - Enemy pieces do not (there is no enemy deck), and are always Normal.
#   - The c4 pawn is a spawned pawn: free and stage-only, with no instanceId.
#     It is Rare, and its promotion result was rolled at generation and is shown
#     to the player: a Rare knight. A Rare pawn would usually promote one tier up,
#     but Act I caps everything at Rare (docs/02 §2.2).
#   - An enemy knight has already been captured (salvage paid); checkmate is the
#     only way to clear the stage (docs/02 §7).
#   - A Lockdown modifier is live against the b7 pawn, expiring at the end of the
#     enemy's next turn.


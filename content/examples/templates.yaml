# Stage templates — designed encounter skeletons.
#
# A template fixes the SHAPE of an encounter (enemy composition, turn limit,
# board sparsity) and leaves placement + the player's army to generation. The
# player's army always comes from their current deck.
#
# Checkmate is the only way to clear a stage (docs/02 §7), so the one material
# rule every template must satisfy is that enemyArmyValue sits inside the act
# band from docs/04 §6; the solver then proves a mate exists within turnLimit.
#
# spawnedPawns are free, stage-only pawns for the player (docs/02 §2.2). Their
# ranks must leave rank 8 reachable within the turn limit, so promotion is a
# real option that competes with chasing the coin preview.

templates:
  - id: tpl-act1-open-field
    title: Open Field
    act: 1
    tier: normal
    turnLimit: 8
    openingPlacements: 3
    enemyArmy:
      pawn: [5, 6]
      knight: [1, 1]
    enemyZone: [7, 8]
    spawnedPawns:
      count: [2, 2]
      ranks: [3, 4]
    deploymentRanks: [1, 2]
    deploymentsPerTurn: 1
    focusPool: 3
    enemyPolicy:
      type: best_move
      depth: 2
    preconditions:
      - king_on_board
      - no_precheck
      - no_immediate_mate
      - deployment_squares_available
      - enemy_value_in_band
      - spawned_pawns_placed
    designNote: >-
      Teaching template. Enemy army value 8-9 against an 8-turn limit: enough
      slack to learn deployment and the turn counter without the stage being a
      free win. Depth-2 policy punishes obvious hangs only.

  - id: tpl-act1-first-steps
    title: First Steps
    act: 1
    tier: normal
    turnLimit: 8
    openingPlacements: 3
    placement: fixed
    fixedEnemy:
      e8: king
      a7: pawn
      b7: pawn
      c7: pawn
      f7: pawn
      g7: pawn
      c6: knight
    spawnedPawns:
      count: [2, 2]
      ranks: [3, 4]
    deploymentRanks: [1, 2]
    deploymentsPerTurn: 1
    focusPool: 3
    enemyPolicy:
      type: scripted
      line: [c6e5, e5c4, c4b6]
      fallbackDepth: 2
    preconditions:
      - king_on_board
      - no_precheck
      - no_immediate_mate
      - deployment_squares_available
      - enemy_value_in_band
      - spawned_pawns_placed
    designNote: >-
      Tutorial set piece for run 1, Act I stage 1 (docs/08 §5). The enemy army
      is hand-placed and the knight follows a short script; if the player
      captures it or blocks its path, the enemy falls back to a depth-2
      best_move. The solver still validates the stage against the player's
      actual deck before it is shown.

  - id: tpl-act1-boss-gatehouse
    title: The Gatehouse
    act: 1
    tier: boss
    turnLimit: 7
    openingPlacements: 3
    enemyArmy:
      pawn: [3, 4]
      knight: [1, 1]
      bishop: [1, 1]
    enemyZone: [6, 7, 8]
    spawnedPawns:
      count: [1, 2]
      ranks: [3, 4]
    deploymentRanks: [1, 2]
    deploymentsPerTurn: 1
    focusPool: 3
    enemyPolicy:
      type: best_move
      depth: 4
    preconditions:
      - king_on_board
      - no_precheck
      - no_immediate_mate
      - deployment_squares_available
      - enemy_value_in_band
      - spawned_pawns_placed
    designNote: >-
      Act I boss. Enemy value 9-10 (the Act I band x1.25), seven turns,
      depth-4 policy. Teaches mating under turn pressure: a thicker defence and
      one turn less than the rest of Act I, so the player must find the mating
      net early instead of trading down.

  - id: tpl-act2-fortress
    title: Fortress
    act: 2
    tier: normal
    turnLimit: 6
    openingPlacements: 3
    enemyArmy:
      pawn: [5, 6]
      knight: [1, 1]
      bishop: [1, 1]
    enemyZone: [6, 7, 8]
    spawnedPawns:
      count: [1, 2]
      ranks: [3, 4]
    deploymentRanks: [1, 2]
    deploymentsPerTurn: 1
    focusPool: 3
    enemyPolicy:
      type: best_move
      depth: 3
    preconditions:
      - king_on_board
      - no_precheck
      - no_immediate_mate
      - deployment_squares_available
      - enemy_value_in_band
      - spawned_pawns_placed
    designNote: >-
      Enemy value 11-12, six turns. The slack from Act I is gone: there is no
      slow win to fall back on, so the player must spend durability for tempo
      to reach a mate in time. Tests whether the deck was built or only
      survived.

  - id: tpl-act3-boss-redoubt
    title: The Redoubt
    act: 3
    tier: boss
    turnLimit: 4
    openingPlacements: 3
    enemyArmy:
      pawn: [6, 7]
      knight: [2, 2]
      bishop: [1, 1]
      rook: [1, 1]
    enemyZone: [6, 7, 8]
    spawnedPawns:
      count: [1, 1]
      ranks: [4, 5]
    deploymentRanks: [1, 2]
    deploymentsPerTurn: 1
    focusPool: 3
    enemyPolicy:
      type: best_move
      depth: 4
    preconditions:
      - king_on_board
      - no_precheck
      - no_immediate_mate
      - deployment_squares_available
      - enemy_value_in_band
      - spawned_pawns_placed
    designNote: >-
      Boss. Enemy value 20-21, four turns, depth-4 policy. There is no line that
      does not spend charges and durability. The player who banked coins into
      Act III wins here; the player who emptied the deck in Act I does not.
      Enemy skills are reserved for M6 (docs/11 §B).

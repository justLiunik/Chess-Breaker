# Stage templates — designed encounter skeletons.
#
# A template fixes the SHAPE of an encounter (enemy composition, turn limit,
# board sparsity, material threshold) and leaves placement + the player's army
# to generation. The player's army always comes from their current deck.
#
# Two feasibility rules every template must satisfy (docs/04 §4):
#   enemyArmyValue    is inside the act band from docs/04 §6
#   materialThreshold <= 0.75 * minimum enemyArmyValue
#
# Domination is measured as a captured-minus-lost SWING (docs/02 §7), so the
# threshold is "win the exchange by N", not "own more material on the board".

templates:
  - id: tpl-act1-open-field
    title: Open Field
    act: 1
    tier: normal
    turnLimit: 8
    materialThreshold: 5
    openingPlacements: 3
    enemyArmy:
      pawn: [5, 6]
      knight: [1, 1]
    enemyZone: [7, 8]
    deploymentRanks: [1, 2]
    deploymentsPerTurn: 1
    focusPool: 3
    enemyPolicy:
      type: best_move
      depth: 2
    preconditions:
      - king_on_board
      - no_precheck
      - no_immediate_mate
      - deployment_squares_available
      - enemy_value_in_band
      - threshold_feasible
    designNote: >-
      Teaching template. Enemy army value 8-9 against an 8-turn limit: enough
      slack to learn deployment and the turn counter without the stage being a
      free win. Depth-2 policy punishes obvious hangs only.

  - id: tpl-act2-fortress
    title: Fortress
    act: 2
    tier: normal
    turnLimit: 6
    materialThreshold: 7
    openingPlacements: 3
    enemyArmy:
      pawn: [5, 6]
      knight: [1, 1]
      bishop: [1, 1]
    enemyZone: [6, 7, 8]
    deploymentRanks: [1, 2]
    deploymentsPerTurn: 1
    focusPool: 3
    enemyPolicy:
      type: best_move
      depth: 3
    preconditions:
      - king_on_board
      - no_precheck
      - no_immediate_mate
      - deployment_squares_available
      - enemy_value_in_band
      - threshold_feasible
    designNote: >-
      Enemy value 11-12, threshold 7, six turns. The slack from Act I is gone:
      the player must either spend durability for tempo or accept a slow
      domination win at half payout. Tests whether the deck was built or only
      survived.

  - id: tpl-act3-boss-redoubt
    title: The Redoubt
    act: 3
    tier: boss
    turnLimit: 4
    materialThreshold: 9
    openingPlacements: 3
    enemyArmy:
      pawn: [6, 7]
      knight: [2, 2]
      bishop: [1, 1]
      rook: [1, 1]
    enemyZone: [6, 7, 8]
    deploymentRanks: [1, 2]
    deploymentsPerTurn: 1
    focusPool: 3
    enemyPolicy:
      type: best_move
      depth: 4
    preconditions:
      - king_on_board
      - no_precheck
      - no_immediate_mate
      - deployment_squares_available
      - enemy_value_in_band
      - threshold_feasible
    designNote: >-
      Boss. Enemy value 20-21, four turns, depth-4 policy. There is no line that
      does not spend charges and durability. The player who banked coins into
      Act III wins here; the player who emptied the deck in Act I does not.
      Enemy skills are reserved for M6 (docs/11 §B).

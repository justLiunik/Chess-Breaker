id: tpl-act1-first-steps
title: First Steps
act: 1
tier: normal
turnLimit: 8
placement: fixed
spawnPoints: 6      # Act I's 9 minus a minor: two summons at most on the very first stage
fixedEnemy:
  e8: king
  a7: pawn
  b7: pawn
  c7: pawn
  f7: pawn
  g7: pawn
  c6: knight
spawnedPawns:
  count: [2, 2]
  ranks: [3, 4]
focusPool: 3
enemyPolicy:
  type: scripted
  line: [c6e5, e5c4, c4b6]
  fallbackDepth: 2
preconditions:
  - enemy_king_on_board
  - safe_king_square
  - no_first_turn_mate
  - enemy_has_moves
  - deployment_squares_available
  - enemy_value_in_band
  - spawned_pawns_placed
designNote: >-
  Tutorial set piece for run 1, Act I stage 1 (docs/08 §5). The enemy army
  is hand-placed and the knight follows a short script; if the player
  captures it or blocks its path, the enemy falls back to a depth-2
  best_move. The solver still validates the stage against the player's
  actual deck before it is shown.

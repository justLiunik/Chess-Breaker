designNote: >-
  Act III normal. Enemy value 21-22 (Act III band 14-22), mate in 2-3,
  depth-3 policy. A queen, a rook and a bishop behind the pawns: every enemy
  piece can punish a loose summon, and the par leaves no turn to repair one.
  Army from the Lichess pool (M3 Task 18 compositions report, zone [6, 8],
  band 14-22): pawn 4 + rook + queen and pawn 5 + rook + queen are the two
  most common compositions, pawn 5 and pawn 4 with a bishop added the
  third and fifth. Measured with gen:report's strong deck, seeds
  report-tpl-act3-last-line-0..23, default solver (proven / median mating
  turn vs par / bonus pawn / validationFailed / wall p95): pawn 4-5 + rook +
  queen 54% / 2 vs 3 / 0% / 11 of 24 / 9.4 s, nearly every board having a
  turn-1 mate for the strong deck; in zone [7, 8] 4%, the back rank mates in
  one; spawnPoints 12: 67% / 5 of 24; pawn 5-6 + rook + queen 75% / 6 of 24;
  pawn 6-7 + rook + queen 83% / 3 of 24. Adding the bishop, pawn 4-5 + bishop
  + rook + queen: 96% / 2 vs 3 / 0% / 1 of 24 / 24.3 s, and 100% / 3 vs 3 /
  15.0 s on seeds 24-47; gen:report, 200 stages: 97.5% / 2 vs 3 / 1.5% / 2
  of 200 / 10.8 s.

# Checkbreaker — tuning constants
#
# SINGLE SOURCE OF TRUTH. Every number that shapes the game lives here and nowhere
# else. Prose in docs/ may explain a number, but this file is what the engine reads.
#
# Changing a constant here must never require a code change. If it does, the
# constant is in the wrong place.

version: 0.1.0

# ---------------------------------------------------------------------------
# Rules — see docs/02-rules-framework.md
# ---------------------------------------------------------------------------
rules:
  boardSize: 8
  playerColor: white            # player always moves first (open decision F)
  freeMovesPerTurn: 1           # the Free Move; only skills add credits
  focusPool: 3                  # refills each turn, no carryover
  deploymentRanks: [1, 2, 3, 4] # the player's half: the King and summons go here, never on ranks 5-8; templates cannot change it
  spawnPoints:                  # summon budget per stage; total spawnCost of the summons must fit (docs/02 §5)
    act1: { normal: 9, boss: 12 }
    act2: { normal: 12, boss: 15 }
    act3: { normal: 15, boss: 18 }  # boss = normal + 3; a template may lower its budget, never raise it
  spawnPointsCarryOver: false   # unspent points are lost at Start
  summonCostsDurability: 1      # paid per non-King summon when the player presses Start
  deckLockedAfterStart: true    # no summoning once the first move is made (docs/02 §3)
  minMovesPerQueue: 1           # no pass: every queue contains at least one MOVE
  castling: false
  enPassant: false
  promotion:                    # see docs/02 §2.2
    playerPawns: reward         # a spawned pawn on rank 8 leaves the board and becomes a deck piece
    enemyPawns: queen           # enemy pawns promote by the normal chess rule, to a Normal queen
  kingCapturable: false         # invariant I3 — never
  stalemate: player_loses      # either side without a legal move (not in check) loses the stage for the player

# ---------------------------------------------------------------------------
# Economy — see docs/05-run-structure-and-economy.md
# ---------------------------------------------------------------------------
economy:
  # Stage clear (checkmate is the only win):
  #   coins = max(0, baseReward(act, tier) - overtimePaid) + parBonus(act, tier) if turnsUsed <= mateIn + salvage
  #   Every turn past the par (mateIn) costs overtimeCost(act): from the pending base reward first,
  #   then from the wallet; a turn neither can pay loses the stage (out_of_coins). docs/05 §2.
  baseReward:                   # paid in full for every cleared stage
    act1: 4
    act2: 6
    act3: 8
    bossMultiplier: 1.5         # bosses: 6 / 9 / 12
  parBonus:                     # extra coins for a mate within the par; bosses x bossMultiplier
    act1: 6
    act2: 9
    act3: 12
  overtimeCost:                 # coins per turn past the par; never boss-scaled
    act1: 2
    act2: 3
    act3: 4
  starterCoins: 0

  salvage:                      # coins for capturing an enemy piece
    enabled: true
    divisor: 3                  # floor(value / divisor): pawn 0, minor 1, rook 1, queen 3

  priceInflationPerAct: 0.20    # price(act) = round(base * (1 + 0.20 * (act - 1)))

  services:
    repair: 4                   # +1 durability, never above max, never on spent pieces
    reroll: 2                   # after the free reroll
    freeRerollsPerVisit: 1
    maxRerollsPerVisit: 3
    sell:                       # docs/07 §4 — sell a deck piece for coins; it leaves the run
      priceFactor: 0.5          # of the piece's current shop price (rarity × act inflation); never above recoveryDiscount
      rounding: floor
      when: [shop, capacity_cut]  # in the shop, and as a third option beside merge/cut when a promotion overflows the deck
      excludes: [king, spent]

  shop:
    slots: 5                    # 1–2 pieces, 3–4 piece or skill, 5 service (docs/07 §2)
    randomSlots: 2              # slots 3–4: piece or skill
    recoveryDeckThreshold: 4    # if non-king deck < 4 → slot 1 is a half-price Normal replacement
    recoveryDiscount: 0.5

# ---------------------------------------------------------------------------
# Pieces — mirror of content/examples/pieces.yaml values
#
# Durability is flat: every deck piece has durabilityMax 2 at every tier, except
# the Legendary queen (1). Power per stage is gated by spawnCost against the
# stage's spawnPoints instead (docs/06 §1). spawnCost mirrors chess value but is
# its own key so it can be tuned without touching the AI's material weights.
# ---------------------------------------------------------------------------
pieces:
  king:
    value: 0
    spawnCost: 0                # always placed, always free
    cost: null
    durabilityMax: null         # immortal
    purchasable: false
  pawn:
    value: 1
    spawnCost: 1                # nominal: pawns are never in the deck, so never summoned
    cost: null                  # never sold — pawns only spawn on the stage (docs/06 §4.2)
    durabilityMax: null         # stage-only: never in the deck, never deployed
    purchasable: false
  knight:
    value: 3
    spawnCost: 3
    cost: 8
    durabilityMax: 2
    purchasable: true
  bishop:
    value: 3
    spawnCost: 3
    spawnCostByRarity:
      legendary: 5              # moves like a queen: costs like a rook (docs/06 §1)
    cost: 8
    durabilityMax: 2
    purchasable: true
  rook:
    value: 5
    spawnCost: 5
    cost: 10
    durabilityMax: 2
    purchasable: true
  queen:
    value: 9
    spawnCost: 9                # a whole Act I budget
    cost: 16
    durabilityMax: 2
    durabilityMaxByRarity:
      legendary: 1              # the one exception to flat durability: a glass cannon (docs/06 §1)
    purchasable: true

# ---------------------------------------------------------------------------
# Rarity — see docs/06 §4 and docs/07 §2
#
# Every piece except the King has a rarity tier. Stage Pieces (enemy, and any
# future neutral pieces) are always the base tier. Hero Pieces (deck-owned) may
# hold any tier, and the shop's rarity pool is gated by act.
#
# What each tier does in play is per piece type in
# content/examples/pieces.yaml → rarityAbilities (rules: docs/02 §2.3).
# ---------------------------------------------------------------------------
rarity:
  tiers: [normal, rare, unique, legendary]   # ascending; order is load-bearing
  kingHasRarity: false            # the King has no rarity (null), ever
  enemyPieceRarity: normal        # enemy Stage Pieces are locked to this tier
  starterRarity: normal           # every starter-deck piece
  recoveryOfferRarity: normal     # the recovery replacement piece is Normal

  # price = round(basePrice × priceMultiplier[tier] × (1 + priceInflationPerAct × (act − 1)))
  priceMultiplier: { normal: 1.0, rare: 1.5, unique: 2.0, legendary: 3.0 }

  # Retention: a roll (shop offer or promotion result) that lands on this
  # type × tier keeps that tier only with this probability; otherwise it drops
  # one tier. Makes the Legendary queen ~5× rarer than other Legendary pieces.
  retention:
    queen: { legendary: 0.2 }

  # Rarity pool by act. Used for (a) random shop piece offers, keyed by the act of
  # the stage just cleared — the same act whose prices apply — and (b) spawned
  # pawns, keyed by the act of the stage being generated.
  # `ceiling` is the highest tier the pool may produce; every tier above it must
  # have weight 0. Ceilings never go down from one act to the next, and Act I is
  # capped at `rare` by design (validated in scripts/validate-content.mjs).
  # The weights themselves are provisional, pending the M6 balance pass.
  pool:
    act1:
      ceiling: rare
      weights: { normal: 75, rare: 25, unique: 0, legendary: 0 }
    act2:
      ceiling: unique
      weights: { normal: 50, rare: 38, unique: 12, legendary: 0 }
    act3:
      ceiling: legendary
      weights: { normal: 30, rare: 40, unique: 24, legendary: 6 }

# ---------------------------------------------------------------------------
# Spawned pawns and promotion — see docs/02 §2.2 and docs/06 §4.2
#
# Each stage spawns a few pawns for the player (count and ranks come from the
# template). They are stage-only: no deck slot, no durability. Their rarity is
# rolled from rarity.pool for the act, and their promotion result is rolled at
# generation time and shown on the pawn, so promotion is never a hidden dice roll.
# ---------------------------------------------------------------------------
promotion:
  resultTypeWeights: { knight: 35, bishop: 35, rook: 20, queen: 10 }
  tierUpChance: 0.75              # else the result keeps the pawn's tier
  clampToActCeiling: true         # never above rarity.pool.act<N>.ceiling
  appliesRetention: true          # rarity.retention (e.g. Legendary queen) applies here too
  rolledAtGeneration: true        # visible on the pawn from turn 1 (pillar 4)
  joinsDeck: immediately          # in the deck at once, but summonable only from the next stage (deck locked)
  overCapacity: cut_at_stage_end  # forced "cut a piece" chooser before the shop

# ---------------------------------------------------------------------------
# Deck — see docs/06-deck-durability-and-permadeath.md
# ---------------------------------------------------------------------------
deck:
  capacity: 8                   # strict and fixed: never raised, no deck-slot purchase
  kingOccupiesSlot: false       # capacity counts non-king pieces only
  starterDeck:                  # all Normal rarity
    king: 1
    knight: 2
    bishop: 2                   # 4 of 8 slots; pawns come from the stage, not the deck
  durability:
    spentIsFinal: true          # a piece at 0 durability may not be repaired
    destroyedAtStageEnd: true   # spent pieces are removed after the stage, not instantly
  capture:
    removesFromRun: true        # permanent, unrecoverable (Unique+ queen lifeline excepted)
  merge:                        # docs/06 §5 — 3 identical pieces → 1 piece one tier up
    inputs: 3                   # same pieceType AND same rarity, all with durability >= 1
    resultDurability: full      # full durabilityMax for the new type × tier
    clampToActCeiling: true     # never above rarity.pool.act<N>.ceiling
    maxInputTier: unique        # Legendary pieces cannot be merged further
    excludedTypes: [king, pawn]
    cost: 0                     # free; the price is giving up three pieces
    when: [shop, capacity_cut]  # in the shop, and as an alternative to cutting after a promotion

# ---------------------------------------------------------------------------
# Run and stages — see docs/05 and docs/04
# ---------------------------------------------------------------------------
stages:
  acts: 3
  stagesPerAct: 3
  bossStageIndex: 3
  shopAfterEveryStage: true
  shopAfterFinalStage: false

  enemyArmyValueBand:           # per docs/04 §6 difficulty curve
    act1: [7, 9]
    act2: [10, 14]
    act3: [14, 22]
    bossMultiplier: 1.25

# ---------------------------------------------------------------------------
# Generation and solver — see docs/04
# ---------------------------------------------------------------------------
generation:
  maxRegenerations: 20
  maxPlacementTries: 50
  solver:
    nodeBudget: 200000
    timeMs: 2000
    minSolveTurns: 2                # rejects free wins
    orderHeuristic: mate_first
  acceptance:
    minSolvableRate: 0.95
    medianWinTurnTolerance: 0.20
  memoizeEnemyReplies: true       # the enemy is a pure function: cache its reply per position

# ---------------------------------------------------------------------------
# Enemy AI — see docs/02 §8.1
#
# One pure function, enemyMove(stage, seed), shared by the engine, the solver
# and replay. Scores are from the ENEMY's point of view (higher = better for it).
# ---------------------------------------------------------------------------
enemyAI:
  search:
    algorithm: alpha_beta
    iterativeDeepening: true        # depth 1, 2, … up to the policy depth
    transpositionTable: true        # deterministic: keyed by position + side + turns left
    quiescence:                     # keep resolving captures past the horizon
      capturesOnly: true
      maxDepth: 2
    playerModel: single_standard_move   # skills and bonus moves are not imagined
    defaultFallbackDepth: 3         # used when a scripted line breaks or runs out
    maxDepthWithRarity: 3           # cap on the search depth while any player piece is Rare or higher (docs/02 §8.1): rarity abilities enlarge the tree, Legendary boards took ~160 ms at depth 4
  terminal:                         # always outrank every positional score
    playerMated: 100000             # minus plies to reach it: sooner is better; either side's stalemate scores the same (player loses)
    playerOutOfClock: 50000         # the clock runs out on the player
    enemyMated: -100000             # plus plies to reach it: delayed as long as possible
  weights:                          # positional terms, "defend first, punish mistakes"
    kingEscapeSquare: 30            # per legal enemy-king move
    kingZoneAttacked: -25           # per square next to the enemy king the player attacks
    kingInCheck: -60
    materialPerPoint: 10            # (enemy − player on-board material), P1 N3 B3 R5 Q9
    mobilityPerMove: 2              # per legal enemy move
  tieBreak: seeded                  # among equal scores: pick by hash(stageSeed, turnsUsed)

# ---------------------------------------------------------------------------
# Skills — see docs/03
# ---------------------------------------------------------------------------
skills:
  loadoutSlots: 3
  chargesRefreshPerStage: true
  duplicatePurchase:
    priceMultiplier: 0.5
    chargeBonus: 1
  tuningOrder: [charges, cost, duration, targeting, new_primitive]

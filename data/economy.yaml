# Checkbreaker — tuning constants
#
# SINGLE SOURCE OF TRUTH. Every number that shapes the game lives here and nowhere
# else. Prose in docs/ may explain a number, but this file is what the engine reads.
#
# Changing a constant here must never require a code change. If it does, the
# constant is in the wrong place.

version: 0.1.0

# ---------------------------------------------------------------------------
# Rules — see docs/02-rules-framework.md
# ---------------------------------------------------------------------------
rules:
  boardSize: 8
  playerColor: white            # player always moves first (open decision F)
  freeMovesPerTurn: 1           # the Free Move; only skills add credits
  focusPool: 3                  # refills each turn, no carryover
  deploymentRanks: [1, 2]       # empty squares here may receive a DEPLOY
  deploymentsPerTurn: 1
  openingPlacements: 3          # free, random, always includes the King
  castling: false
  enPassant: false
  promotion:                    # see docs/02 §2.2
    playerPawns: reward         # a spawned pawn on rank 8 leaves the board and becomes a deck piece
    enemyPawns: queen           # enemy pawns promote by the normal chess rule, to a Normal queen
  kingCapturable: false         # invariant I3 — never
  stalemateBehavior: enemy_passes

# ---------------------------------------------------------------------------
# Economy — see docs/05-run-structure-and-economy.md
# ---------------------------------------------------------------------------
economy:
  coinRate:                     # coins per unused turn, by act
    act1: 2
    act2: 3
    act3: 4
  dominationPayoutMultiplier: 0.5   # safe route pays half
  starterCoins: 0

  salvage:                      # coins for capturing an enemy piece
    enabled: true
    divisor: 3                  # floor(value / divisor): pawn 0, minor 1, rook 1, queen 3

  priceInflationPerAct: 0.20    # price(act) = round(base * (1 + 0.20 * (act - 1)))

  services:
    repair: 4                   # +1 durability, never above max, never on spent pieces
    deckSlot: 12                # +1 capacity
    reroll: 2                   # after the free reroll
    freeRerollsPerVisit: 1
    maxRerollsPerVisit: 3

  shop:
    slots: 5                    # 1–2 pieces, 3–4 piece or skill, 5 service (docs/07 §2)
    randomSlots: 2              # slots 3–4: piece or skill
    recoveryDeckThreshold: 4    # if non-king deck < 4 → slot 1 is a half-price Normal replacement
    recoveryDiscount: 0.5

# ---------------------------------------------------------------------------
# Pieces — mirror of content/examples/pieces.yaml values
# ---------------------------------------------------------------------------
pieces:
  king:
    value: 0
    cost: null
    durabilityMax: null         # immortal
    purchasable: false
  pawn:
    value: 1
    cost: null                  # never sold — pawns only spawn on the stage (docs/06 §4.2)
    durabilityMax: null         # stage-only: never in the deck, never deployed
    purchasable: false
  knight:
    value: 3
    cost: 8
    durabilityMax: 2
    purchasable: true
  bishop:
    value: 3
    cost: 8
    durabilityMax: 2
    durabilityMaxByRarity:
      legendary: 1              # moves like a queen, so it deploys like one (docs/06 §1)
    purchasable: true
  rook:
    value: 5
    cost: 10
    durabilityMax: 2
    purchasable: true
  queen:
    value: 9
    cost: 16
    durabilityMax: 1            # one deployment ever — a burst, not a soldier
    purchasable: true

# ---------------------------------------------------------------------------
# Rarity — see docs/06 §4 and docs/07 §2
#
# Every piece except the King has a rarity tier. Stage Pieces (enemy, and any
# future neutral pieces) are always the base tier. Hero Pieces (deck-owned) may
# hold any tier, and the shop's rarity pool is gated by act.
#
# What each tier does in play is per piece type in
# content/examples/pieces.yaml → rarityAbilities (rules: docs/02 §2.3).
# ---------------------------------------------------------------------------
rarity:
  tiers: [normal, rare, unique, legendary]   # ascending; order is load-bearing
  kingHasRarity: false            # the King has no rarity (null), ever
  enemyPieceRarity: normal        # enemy Stage Pieces are locked to this tier
  starterRarity: normal           # every starter-deck piece
  recoveryOfferRarity: normal     # the recovery replacement piece is Normal

  # price = round(basePrice × priceMultiplier[tier] × (1 + priceInflationPerAct × (act − 1)))
  priceMultiplier: { normal: 1.0, rare: 1.5, unique: 2.0, legendary: 3.0 }

  # Retention: a roll (shop offer or promotion result) that lands on this
  # type × tier keeps that tier only with this probability; otherwise it drops
  # one tier. Makes the Legendary queen ~5× rarer than other Legendary pieces.
  retention:
    queen: { legendary: 0.2 }

  # Rarity pool by act. Used for (a) random shop piece offers, keyed by the act of
  # the stage just cleared — the same act whose prices apply — and (b) spawned
  # pawns, keyed by the act of the stage being generated.
  # `ceiling` is the highest tier the pool may produce; every tier above it must
  # have weight 0. Ceilings never go down from one act to the next, and Act I is
  # capped at `rare` by design (validated in scripts/validate-content.mjs).
  # The weights themselves are provisional, pending the M6 balance pass.
  pool:
    act1:
      ceiling: rare
      weights: { normal: 75, rare: 25, unique: 0, legendary: 0 }
    act2:
      ceiling: unique
      weights: { normal: 50, rare: 38, unique: 12, legendary: 0 }
    act3:
      ceiling: legendary
      weights: { normal: 30, rare: 40, unique: 24, legendary: 6 }

# ---------------------------------------------------------------------------
# Spawned pawns and promotion — see docs/02 §2.2 and docs/06 §4.2
#
# Each stage spawns a few pawns for the player (count and ranks come from the
# template). They are stage-only: no deck slot, no durability. Their rarity is
# rolled from rarity.pool for the act, and their promotion result is rolled at
# generation time and shown on the pawn, so promotion is never a hidden dice roll.
# ---------------------------------------------------------------------------
promotion:
  resultTypeWeights: { knight: 35, bishop: 35, rook: 20, queen: 10 }
  tierUpChance: 0.75              # else the result keeps the pawn's tier
  clampToActCeiling: true         # never above rarity.pool.act<N>.ceiling
  appliesRetention: true          # rarity.retention (e.g. Legendary queen) applies here too
  rolledAtGeneration: true        # visible on the pawn from turn 1 (pillar 4)
  joinsDeck: immediately          # deployable later in the same stage
  overCapacity: cut_at_stage_end  # forced "cut a piece" chooser before the shop

# ---------------------------------------------------------------------------
# Deck — see docs/06-deck-durability-and-permadeath.md
# ---------------------------------------------------------------------------
deck:
  startCapacity: 8
  maxCapacity: 14
  kingOccupiesSlot: false       # capacity counts non-king pieces only
  starterDeck:                  # all Normal rarity
    king: 1
    knight: 2
    bishop: 2                   # 4 of 8 slots; pawns come from the stage, not the deck
  durability:
    spentIsFinal: true          # a piece at 0 durability may not be repaired
    destroyedAtStageEnd: true   # spent pieces are removed after the stage, not instantly
  capture:
    removesFromRun: true        # permanent, unrecoverable
    appliesToOpeningLine: true  # the opening line is drawn from the deck, so it can die too

# ---------------------------------------------------------------------------
# Run and stages — see docs/05 and docs/04
# ---------------------------------------------------------------------------
stages:
  acts: 3
  stagesPerAct: 3
  bossStageIndex: 3
  shopAfterEveryStage: true
  shopAfterFinalStage: false

  turnLimits:
    act1: 8
    act2: 6
    act3: 5
    bossPenalty: 1              # bosses get limit - 1

  materialThreshold:            # required capture swing, by act
    act1: 5
    act2: 7
    act3: 9

  enemyArmyValueBand:           # per docs/04 §6 difficulty curve
    act1: [7, 9]
    act2: [10, 14]
    act3: [14, 22]
    bossMultiplier: 1.25

# ---------------------------------------------------------------------------
# Generation and solver — see docs/04
# ---------------------------------------------------------------------------
generation:
  maxRegenerations: 20
  maxPlacementTries: 50
  thresholdFeasibilityRatio: 0.75   # materialThreshold <= ratio * enemyMaterialValue
  solver:
    nodeBudget: 200000
    timeMs: 2000
    minSolveTurns: 2                # rejects free wins
    orderHeuristic: mate_first
  acceptance:
    minSolvableRate: 0.95
    checkmateShareMin: 0.20
    medianWinTurnTolerance: 0.20

# ---------------------------------------------------------------------------
# Skills — see docs/03
# ---------------------------------------------------------------------------
skills:
  loadoutSlots: 3
  chargesRefreshPerStage: true
  duplicatePurchase:
    priceMultiplier: 0.5
    chargeBonus: 1
  tuningOrder: [charges, cost, duration, targeting, new_primitive]
